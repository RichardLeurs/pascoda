[package]
name = "pascoda-app"
version = "0.1.0"
edition = "2024"

[dependencies]
pascoda-dap = { version = "0.1.0", path = "../pascoda-dap" }
pascoda-ai = { version = "0.1.0", path = "../pascoda-ai" }
pascoda-fpc = { path = "../pascoda-fpc" }
pascoda-lsp = { version = "0.1.0", path = "../pascoda-lsp" }
pascoda-project = { path = "../pascoda-project" }
eframe = "0.37.0"
muda = "0.21.2"
rfd = "0.17.2"
serde_json = "1.0.154"
pascoda-forms = { version = "0.1.0", path = "../pascoda-forms" }
